<style>
  :root {
    color-scheme: dark;
    --night: #0e1134;
    --paper: #fff8e8;
    --paper-2: #f6ead0;
    --brown: #6b4c39;
    --brown-soft: #9b7a5f;
    --coral: #f06a5b;
    --coral-deep: #c94c3f;
    --moon: #ffe9b8;
    --gold: #f7cb62;
    --glass: rgba(20, 22, 60, 0.42);
    --ui: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --brush: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--paper); font-family: var(--ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
  #app { position: fixed; inset: 0; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* ---------- start ---------- */
  #start { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto; justify-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px max(24px, env(safe-area-inset-bottom, 0px)); pointer-events: none; transition: opacity .7s ease; }
  #start.leaving { opacity: 0; }
  .title { align-self: start; text-align: center; display: grid; gap: 10px; pointer-events: none; margin-top: 4vh; }
  .title h1 { margin: 0; font-family: var(--brush); font-weight: 400; font-size: clamp(56px, 11vw, 124px); line-height: 1; letter-spacing: .08em; color: var(--moon); text-shadow: 0 0 28px rgba(255, 214, 140, .45), 0 2px 0 rgba(60, 30, 20, .35); }
  .title h1 .dot { color: var(--coral); }
  .title p { margin: 0; font-size: clamp(15px, 2.1vw, 19px); letter-spacing: .12em; color: #e9e3ff; text-shadow: 0 1px 8px rgba(10, 10, 40, .7); }
  .card { pointer-events: auto; background: var(--paper); color: var(--brown); border-radius: 28px; box-shadow: 0 12px 0 -4px rgba(120, 84, 60, .35), 0 24px 60px rgba(5, 5, 30, .45); }
  .start-card { width: min(500px, 100%); box-sizing: border-box; padding: 20px 20px 22px; display: grid; gap: 18px; justify-items: center; }
  /* controls: four equal columns, the key or mouse picture on top and a short label under it */
  .ctl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; margin: 0; padding: 0; list-style: none; }
  .ctl li { position: relative; display: grid; justify-items: center; align-content: start; gap: 8px; padding: 2px 4px; min-width: 0; }
  .ctl li + li::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; border-left: 2px dotted #ead9b8; }
  .ctl-ic { display: flex; align-items: center; justify-content: center; gap: 5px; height: 36px; color: var(--brown); }
  .ctl-ic svg { width: 50px; height: 38px; }
  .ctl kbd { min-width: 32px; height: 32px; font-size: 16px; }
  .ctl-tx { font-size: 13px; letter-spacing: .06em; color: var(--brown-soft); white-space: nowrap; }
  .keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; margin: 0; padding: 0; list-style: none; font-size: 15px; }
  .keys li { display: flex; align-items: center; gap: 8px; min-width: 0; }
  kbd { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; box-sizing: border-box; border-radius: 9px; background: var(--paper-2); color: var(--brown); font-family: var(--ui); font-size: 15px; box-shadow: inset 0 -3px 0 rgba(120, 84, 60, .28); }
  .go-row { display: flex; align-items: center; justify-content: center; min-height: 56px; }
  .btn.go { position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 12px 38px 12px 30px; font-size: 22px; letter-spacing: .3em; }
  .btn.go span { margin-right: -.3em; }
  .btn.go:focus-visible { outline: 2px solid rgba(247, 203, 98, .8); outline-offset: 5px; }
  .btn.go svg { width: 26px; height: 26px; flex: none; }
  .btn.go::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 2px solid rgba(240, 106, 91, .7); pointer-events: none; animation: goRing 2.6s ease-out infinite; }
  @keyframes goRing { 0% { opacity: .9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.12, 1.4); } }
  .hint { font-size: 13px; color: var(--brown-soft); margin: 0; }
  .btn { border: 0; border-radius: 999px; padding: 12px 30px; font-size: 20px; letter-spacing: .12em; background: var(--coral); color: #fff9ef; box-shadow: 0 5px 0 var(--coral-deep); transition: transform .15s ease, box-shadow .15s ease; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--coral-deep); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--coral-deep); }
  .btn.soft { background: var(--paper); color: var(--brown); box-shadow: 0 5px 0 #d8c29e; }
  #loading { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--brown-soft); }
  #loading::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #e7d3b0; border-top-color: var(--coral); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; transition: opacity 1.2s ease; }
  #hud.dim { opacity: 0; }
  #hud.dim .place, #hud.dim .cam-mode { pointer-events: none; }
  .place { position: absolute; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); pointer-events: auto; background: rgba(255, 248, 232, .93); color: var(--brown); border-radius: 22px; box-sizing: border-box; padding: 6px 14px 10px 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 0 -2px rgba(120, 84, 60, .3); }
  .voyage { display: grid; gap: 8px; }
  .vrow { display: flex; align-items: center; gap: 10px; padding-top: 16px; }
  #route { --p: 0; position: relative; width: clamp(120px, 17vw, 200px); height: 6px; border-radius: 3px; background: #ead9b8; box-shadow: inset 0 1px 0 rgba(0, 0, 0, .06); }
  .speed { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .1em; color: var(--brown-soft); }
  #speedDots { display: flex; gap: 4px; }
  #speedDots i { width: 14px; height: 6px; border-radius: 3px; background: #ead9b8; transition: background .25s ease; }
  #speedDots i.on { background: #6cc3a6; }
  #route::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(100% * var(--p)); border-radius: 3px; background: var(--coral); }
  .boat-mark { position: absolute; z-index: 1; left: calc(100% * var(--p)); top: -19px; width: 31px; height: 20px; margin-left: -15px; animation: boatBob 2.6s ease-in-out infinite; }
  .boat-mark svg { width: 100%; height: 100%; display: block; }
  @keyframes boatBob { 50% { transform: translateY(-2px) rotate(-3deg); } }
  .moon-mark { flex: none; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 38% 38%, #fffaf0, #ffd98a); box-shadow: 0 0 9px 2px rgba(255, 214, 140, .75); }
  .badge { flex: none; width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 2px solid var(--gold); background: radial-gradient(circle, #fff6d6, #ffe2a0); display: grid; place-items: center; box-shadow: 0 0 12px rgba(247, 203, 98, .75); }
  .badge svg { width: 22px; height: 22px; }
  .badge.pop { animation: badgePop .8s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes badgePop { 0% { transform: scale(.4); } 60% { transform: scale(1.25); box-shadow: 0 0 26px 6px rgba(247, 203, 98, .9); } }
  /* camera mode switch */
  .cam-mode { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(255, 248, 232, .93); box-shadow: 0 6px 0 -2px rgba(120, 84, 60, .3); pointer-events: auto; }
  .cam-mode button { display: flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 7px 15px 7px 12px; background: transparent; color: var(--brown-soft); font-size: 15px; letter-spacing: .06em; white-space: nowrap; transition: background .25s ease, color .25s ease, box-shadow .25s ease; }
  .cam-mode button:hover { color: var(--brown); }
  .cam-mode button[aria-checked="true"] { background: var(--coral); color: #fff9ef; box-shadow: 0 3px 0 var(--coral-deep); }
  .cam-mode svg { width: 18px; height: 18px; flex: none; }
  /* letterbox bars in the cinematic mode */
  #bars { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #bars::before, #bars::after { content: ""; position: absolute; left: 0; right: 0; height: min(7vh, 56px); background: #04050d; opacity: .92; transition: transform 1.1s cubic-bezier(.3, .7, .2, 1); }
  #bars::before { top: 0; transform: translateY(-101%); }
  #bars::after { bottom: 0; transform: translateY(101%); }
  body.cine #bars::before, body.cine #bars::after { transform: none; }
  /* achievement */
  #achieve { position: absolute; left: 0; right: 0; top: 24vh; z-index: 7; display: flex; justify-content: center; padding-inline: 16px; pointer-events: none; }
  .ach-card { display: flex; align-items: center; gap: 18px; padding: 16px 28px 16px 18px; border-radius: 28px; pointer-events: none; }
  #achieve.show .ach-card { animation: achIn .75s cubic-bezier(.2, 1.5, .4, 1) both; }
  #achieve.out .ach-card { animation: achOut .45s ease both; }
  @keyframes achIn { from { opacity: 0; transform: translateY(18px) scale(.7); } }
  @keyframes achOut { to { opacity: 0; transform: scale(.92); } }
  .ach-icon { position: relative; flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, #fff6d6, #ffd98a); border: 3px solid var(--gold); box-sizing: border-box; box-shadow: 0 0 24px rgba(247, 203, 98, .85); }
  .ach-icon svg { width: 42px; height: 42px; }
  .ach-icon::before { content: ""; position: absolute; inset: -20px; z-index: -1; border-radius: 50%; background: repeating-conic-gradient(rgba(255, 200, 110, .55) 0 9deg, transparent 9deg 30deg); -webkit-mask: radial-gradient(circle, #000 35%, transparent 70%); mask: radial-gradient(circle, #000 35%, transparent 70%); animation: spin 9s linear infinite; }
  .ach-fly { position: fixed; z-index: 9; pointer-events: none; }
  .ach-fly::before { display: none; }
  .ach-text { display: grid; gap: 3px; }
  .ach-text small { font-size: 13px; letter-spacing: .32em; color: var(--coral); }
  .ach-text strong { font-family: var(--brush); font-weight: 400; font-size: 32px; line-height: 1.1; letter-spacing: .1em; color: var(--brown); }
  .ach-sub { font-size: 14px; color: var(--brown-soft); }
  #toolbar { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .tools { position: absolute; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; gap: 10px; pointer-events: auto; }
  .round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255, 248, 232, .93); color: var(--brown); display: grid; place-items: center; box-shadow: 0 4px 0 -1px rgba(120, 84, 60, .32); }
  .round svg { width: 22px; height: 22px; }
  .round.off .wave { display: none; }
  .round:not(.off) .mute { display: none; }
  #help { position: absolute; right: 16px; top: calc(70px + env(safe-area-inset-top, 0px)); width: min(320px, calc(100vw - 32px)); box-sizing: border-box; padding: 16px 18px; display: grid; gap: 12px; }
  #help h2 { margin: 0; font-size: 17px; font-weight: 400; }
  #help .row { display: flex; justify-content: space-between; align-items: center; }

  /* ---------- place title ---------- */
  #zoneTitle { position: absolute; left: 0; right: 0; top: 16vh; display: grid; justify-items: center; gap: 6px; pointer-events: none; opacity: 0; padding-inline: 16px; }
  #zoneTitle.show { animation: zt 4.6s ease forwards; }
  .zt-name { font-family: var(--brush); font-size: clamp(44px, 7vw, 76px); color: var(--moon); letter-spacing: .12em; text-shadow: 0 0 24px rgba(255, 210, 140, .5), 0 2px 10px rgba(10, 10, 40, .6); }
  .zt-en { font-size: 13px; letter-spacing: .38em; text-transform: uppercase; color: #efe8ff; text-shadow: 0 1px 8px rgba(10, 10, 40, .8); }
  @keyframes zt { 0% { opacity: 0; transform: translateY(10px); filter: blur(6px); } 14% { opacity: 1; transform: none; filter: none; } 72% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); filter: blur(4px); } }

  /* ---------- poem ---------- */
  #poem { position: absolute; right: max(20px, 7vw); top: calc(max(78px, 13vh) + env(safe-area-inset-top, 0px)); display: flex; flex-direction: row-reverse; align-items: flex-start; gap: clamp(12px, 2vw, 26px); pointer-events: none; }
  #poem .col { margin: 0; display: flex; flex-direction: column; font-family: var(--brush); font-size: clamp(38px, 6.4vh, 74px); line-height: 1.12; color: var(--moon); text-shadow: 0 0 22px rgba(255, 214, 150, .55), 0 2px 12px rgba(10, 10, 40, .55); }
  #poem .ch { opacity: 0; filter: blur(8px); transform: translateY(-8px) scale(1.06); transition: opacity 1.6s ease, filter 1.6s ease, transform 1.6s ease; }
  #poem .ch.on { opacity: 1; filter: blur(0); transform: none; }
  #poem .side { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 3.2em; }
  #poem .insc { writing-mode: vertical-rl; font-family: var(--brush); font-size: clamp(15px, 2vh, 20px); letter-spacing: .2em; color: #efe6ff; opacity: 0; transition: opacity 2s ease; text-shadow: 0 1px 8px rgba(10, 10, 40, .8); }
  /* square seal, carved white seal-script (2x2, read right column first: 花好 / 月圆) */
  #poem .poem-seal { display: block; width: clamp(48px, 7vh, 70px); height: clamp(48px, 7vh, 70px); opacity: 0; transform: scale(1.6); transition: opacity .35s ease, transform .45s cubic-bezier(.2, 1.4, .4, 1); filter: drop-shadow(0 2px 8px rgba(0, 0, 0, .35)); }
  #poem .poem-seal svg { display: block; width: 100%; height: 100%; }
  #poem .on { opacity: 1 !important; transform: none !important; }
  #endBtns { position: absolute; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; padding-inline: 16px; animation: rise .8s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }


  /* ---------- lantern letters ---------- */
  #eggLayer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
  .egg { position: absolute; left: 0; top: 0; width: 52px; height: 58px; margin: -58px 0 0 -26px; padding: 0; border: 0; background: none; pointer-events: none; cursor: pointer; will-change: transform; transform-origin: 26px 58px; }
  .egg-b { position: absolute; left: 4px; top: 0; width: 44px; height: 44px; border-radius: 50%; background: var(--paper); border: 3px solid var(--brown); box-sizing: border-box; display: grid; place-items: center; opacity: 0; transform: scale(.3) translateY(14px); transition: opacity .35s ease, transform .45s cubic-bezier(.2, 1.6, .4, 1); box-shadow: 0 4px 0 -1px rgba(107, 76, 57, .35), 0 0 0 0 rgba(255, 214, 140, .6); }
  .egg-b::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 12px; height: 12px; background: var(--paper); border-right: 3px solid var(--brown); border-bottom: 3px solid var(--brown); transform: translateX(-50%) rotate(45deg); border-radius: 0 0 3px 0; }
  .egg-g { position: relative; z-index: 1; font-family: var(--ui); font-size: 25px; line-height: 1; color: var(--coral); }
  .egg.on { pointer-events: auto; }
  .egg.on .egg-b { opacity: 1; transform: none; animation: eggBob 2.2s ease-in-out infinite, eggGlow 2.2s ease-out infinite; }
  .egg.on:hover .egg-b, .egg.on:focus-visible .egg-b { background: #fff3c9; }
  .egg.picked { pointer-events: none; }
  .egg.picked .egg-b { opacity: 0; transform: scale(1.6); transition: opacity .3s ease, transform .3s ease; animation: none; }
  @keyframes eggBob { 50% { transform: translateY(-3px); } }
  @keyframes eggGlow { 0% { box-shadow: 0 4px 0 -1px rgba(107, 76, 57, .35), 0 0 0 0 rgba(255, 214, 140, .7); } 100% { box-shadow: 0 4px 0 -1px rgba(107, 76, 57, .35), 0 0 0 16px rgba(255, 214, 140, 0); } }
  #toast { position: absolute; left: 50%; top: 28vh; transform: translateX(-50%); padding: 10px 20px; border-radius: 999px; background: rgba(255, 248, 232, .95); color: var(--brown); font-size: 16px; opacity: 0; pointer-events: none; z-index: 6; white-space: nowrap; box-shadow: 0 6px 0 -2px rgba(120, 84, 60, .3); }
  #toast.show { animation: toast 4s ease forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

  #letter { position: absolute; inset: 0; z-index: 8; display: flex; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
  .letter-back { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(20, 18, 60, .35), rgba(8, 8, 30, .78)); animation: fadeIn .4s ease both; }
  .letter-wrap { position: relative; margin: auto; display: grid; justify-items: center; gap: 20px; width: min(500px, 100%); animation: unfold .8s cubic-bezier(.2, .9, .3, 1.08) both; }
  #letter.closing .letter-wrap { animation: fold .42s ease-in both; }
  #letter.closing .letter-back { animation: fadeOut .42s ease both; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes unfold { 0% { opacity: 0; transform: translateY(40px) scale(.55, .06); } 40% { opacity: 1; transform: translateY(0) scale(1, .1); } 100% { transform: none; } }
  @keyframes fold { to { opacity: 0; transform: translateY(30px) scale(.9, .05); } }
  .note { position: relative; width: 100%; box-sizing: border-box; padding: 34px 32px 26px; border-radius: 6px; color: var(--ink); background: var(--paper); box-shadow: 0 26px 70px rgba(0, 0, 0, .5), 0 1px 0 rgba(255, 255, 255, .6) inset; overflow: hidden; }
  .note::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35; mix-blend-mode: multiply; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .5 0'/></filter><rect width='160' height='160' filter='url(%23f)'/></svg>"); }
  .note.dark::before { mix-blend-mode: screen; opacity: .12; }
  .note .deco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .note p { position: relative; margin: 0; }
  /* the paper stays square; only the handwriting leans a little, like a real hand */
  .note-poem { display: grid; justify-items: center; gap: 2px; font-size: min(var(--ps), 8.4vw); line-height: 1.3; margin-bottom: 16px !important; transform: rotate(calc(var(--tilt) * .7)) skewX(var(--skew)); }
  .note-msg { font-size: min(var(--ns), 5.6vw); line-height: 1.75; margin-bottom: 18px !important; transform: rotate(calc(var(--tilt) * .9)) skewX(var(--skew)); transform-origin: left center; text-wrap: pretty; }
  .note-sign { display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-size: min(calc(var(--ns) * .95), 5.2vw); line-height: 1.4; text-align: right; transform: rotate(calc(var(--tilt) * -.5)); }
  .seal-wrap { flex: none; display: inline-block; opacity: 0; animation: stamp .35s cubic-bezier(.2, 1.8, .4, 1) forwards; }
  .seal { width: 60px; height: 60px; display: block; transform: rotate(-7deg); mix-blend-mode: multiply; }
  .note.dark .seal { mix-blend-mode: normal; }
  @keyframes stamp { from { opacity: 0; transform: scale(1.8); } to { opacity: .92; transform: none; } }
  .note .w { opacity: 0; animation: ink .5s ease forwards; }
  .note.done .w, .note.done .seal-wrap { animation-delay: 0s !important; animation-duration: .2s; }
  @keyframes ink { from { opacity: 0; filter: blur(2.5px); } to { opacity: 1; filter: none; } }
  .note.neon { box-shadow: 0 26px 70px rgba(0, 0, 0, .5), inset 0 0 0 3px var(--accent), inset 0 0 22px rgba(57, 243, 255, .35); }
  .note.neon .note-poem { text-shadow: 0 0 10px rgba(255, 215, 106, .6); letter-spacing: .06em; }
  .note.glow .note-poem, .note.glow .note-msg { text-shadow: 0 0 12px var(--ink); }
  .note.drift .note-msg { letter-spacing: .14em; transform: rotate(2.4deg); transform-origin: left top; }
  .note.drift .note-poem { transform: rotate(-2deg); }
  .note.shy .note-msg { letter-spacing: .1em; opacity: .9; }
  .note.shy .note-poem { letter-spacing: .12em; }
  #btnKeep { font-size: 18px; padding: 10px 26px; }
  @media (max-height: 600px) {
    .letter-wrap { gap: 12px; }
    .note { padding: 18px 22px 14px; }
    .note-poem { font-size: min(var(--ps), 7.2vh); margin-bottom: 8px !important; }
    .note-msg { font-size: min(var(--ns), 4.6vh); line-height: 1.55; margin-bottom: 10px !important; }
    .note-sign { font-size: min(calc(var(--ns) * .9), 4.4vh); }
    .seal { width: 46px; height: 46px; }
    #btnKeep { font-size: 16px; padding: 8px 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .note .w, .seal-wrap { animation: none; opacity: 1; }
    .letter-wrap, #letter.closing .letter-wrap { animation-duration: .01s; }
    .egg.on .egg-b { animation: none; }
  }

  /* ---------- touch pad ---------- */
  #touch { position: absolute; inset: auto 0 0 0; padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; pointer-events: none; }
  #touch .pad { display: flex; gap: 12px; pointer-events: auto; }
  #touch button { width: 64px; height: 64px; border-radius: 50%; border: 0; background: rgba(255, 248, 232, .88); color: var(--brown); font-size: 24px; box-shadow: 0 5px 0 -1px rgba(120, 84, 60, .35); touch-action: none; user-select: none; -webkit-user-select: none; }
  #touch button.down { transform: translateY(3px); background: var(--gold); }
  #touch .vert { flex-direction: column; }

  .touch-only { display: none; }
  @media (pointer: coarse) {
    .touch-only { display: grid; } .mouse-only { display: none; }
    .ctl.touch-only { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    /* the steering pads live at the bottom, so the camera switch moves under the voyage bar */
    .cam-mode { left: 12px; top: calc(92px + env(safe-area-inset-top, 0px)); bottom: auto; transform: none; }
    .cam-mode button { font-size: 13px; padding: 6px 12px 6px 10px; }
    .cam-mode svg { width: 16px; height: 16px; }
  }
  @media (max-height: 560px) {
    #start { overflow-y: auto; padding-block: 12px; }
    .title { margin-top: 0; gap: 4px; }
    .title h1 { font-size: clamp(40px, 14vh, 72px); }
    .start-card { padding: 12px 16px 14px; gap: 10px; }
    .ctl-ic { height: 28px; } .ctl kbd { min-width: 26px; height: 26px; font-size: 14px; } .ctl-ic svg { width: 36px; height: 28px; }
    .ctl-tx { font-size: 12px; }
    .go-row { min-height: 46px; } .btn.go { padding: 9px 30px 9px 24px; font-size: 19px; }
  }
  @media (max-width: 480px) {
    .round { width: 38px; height: 38px; }
    .round svg { width: 19px; height: 19px; }
    .tools { gap: 8px; right: 12px; }
    .place { left: 12px; padding: 4px 10px 8px 14px; gap: 10px; }
    .voyage { gap: 6px; }
    #speedDots i { width: 12px; }
    #route { width: clamp(90px, 30vw, 140px); }
    .badge { width: 28px; height: 28px; }
    .badge svg { width: 19px; height: 19px; }
    #help { right: 12px; top: calc(60px + env(safe-area-inset-top, 0px)); }
  }
  @media (max-width: 560px) {
    .keys { grid-template-columns: 1fr; }
    .ctl kbd { min-width: 28px; height: 28px; font-size: 14px; } .ctl-ic { gap: 4px; } .ctl-ic svg { width: 38px; }
    .ctl-tx { font-size: 12px; letter-spacing: .02em; }
    .ach-card { gap: 14px; padding: 12px 20px 12px 14px; }
    .ach-icon { width: 54px; height: 54px; }
    .ach-icon svg { width: 34px; height: 34px; }
    .ach-text strong { font-size: 26px; }
    .ach-sub { font-size: 13px; }
    #poem { right: 16px; top: calc(78px + env(safe-area-inset-top, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    #zoneTitle.show { animation-duration: 3s; }
    #poem .ch { transition-duration: .4s; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" tabindex="0" aria-label="三维场景：暹罗猫和比格犬划着小船，在中秋夜的河上航行"></canvas>
  <div id="bars" aria-hidden="true"></div>

  <div id="hud" hidden>
    <div class="place">
      <div class="voyage">
      <div class="vrow">
      <div id="route" role="progressbar" aria-label="航程" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="boat-mark" aria-hidden="true"><svg viewBox="0 0 26 17"><path d="M2 9.5h22l-3.2 5.2a2 2 0 0 1-1.7.9H6.9a2 2 0 0 1-1.7-.9z" fill="#c9774a"/><path d="M2 9.5h22" stroke="#8f4f2e" stroke-width="1.4" stroke-linecap="round"/><circle cx="9.5" cy="6" r="2.9" fill="#f5e6d2"/><path d="M7.4 4.2l-.6-2.6 2 1.4M11.6 4.2l.6-2.6-2 1.4" fill="#6b4c39"/><circle cx="16.5" cy="6.2" r="2.9" fill="#d9a066"/><path d="M14 5.2q-1.6 1-1 3.4M19 5.2q1.6 1 1 3.4" stroke="#8f5a30" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></span>
      </div>
      <span class="moon-mark" aria-hidden="true"></span>
      </div>
      <div class="speed" id="speed" role="img" aria-label="船速 1/5"><span>船速</span><span id="speedDots" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i></span></div>
      </div>
      <button id="badge" class="badge" type="button" hidden aria-label="成就：月下拾灯人" title="月下拾灯人"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20c-5 0-8-2-9-4h18c-1 2-4 4-9 4z" fill="#7cc48a"/><path d="M12 16c-3-2-5-5-4-9 2 1 3 3 4 5 1-2 2-4 4-5 1 4-1 7-4 9z" fill="#ff8fb3"/><path d="M12 16c-5 0-8-3-8-6 3 0 6 2 8 6zm0 0c5 0 8-3 8-6-3 0-6 2-8 6z" fill="#ffc2d6"/><circle cx="12" cy="9.5" r="1.3" fill="#fff4c2"/></svg></button>
    </div>
    <div id="camMode" class="cam-mode" role="radiogroup" aria-label="镜头">
      <button type="button" role="radio" aria-checked="true" data-cam="follow" title="跟随视角 (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3"/></svg><span>跟随视角</span></button>
      <button type="button" role="radio" aria-checked="false" data-cam="cine" title="自由运镜 (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="13" height="10" rx="2.2"/><path d="M15.5 11.5l6-3v9l-6-3z"/><circle cx="6.2" cy="4.6" r="2.3"/><circle cx="12" cy="4.6" r="2.3"/></svg><span>自由运镜</span></button>
    </div>
  </div>
  <div id="achieve" hidden role="status" aria-live="polite">
    <div class="card ach-card">
      <div class="ach-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20c-5 0-8-2-9-4h18c-1 2-4 4-9 4z" fill="#7cc48a"/><path d="M12 16c-3-2-5-5-4-9 2 1 3 3 4 5 1-2 2-4 4-5 1 4-1 7-4 9z" fill="#ff8fb3"/><path d="M12 16c-5 0-8-3-8-6 3 0 6 2 8 6zm0 0c5 0 8-3 8-6-3 0-6 2-8 6z" fill="#ffc2d6"/><circle cx="12" cy="9.5" r="1.3" fill="#fff4c2"/></svg></div>
      <div class="ach-text"><small>成就达成</small><strong>月下拾灯人</strong><span class="ach-sub"></span></div>
    </div>
  </div>

  <div id="eggLayer"></div>
  <div id="zoneTitle" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <section id="start" aria-label="开始">
    <div class="title">
      <h1>中秋<span class="dot">·</span>泛舟</h1>
    </div>
    <div class="card start-card">
      <ul class="ctl mouse-only" aria-label="操作说明">
        <li><span class="ctl-ic"><kbd>↑</kbd><kbd>↓</kbd></span><span class="ctl-tx">加速 · 减速</span></li>
        <li><span class="ctl-ic"><kbd>←</kbd><kbd>→</kbd></span><span class="ctl-tx">左右转向</span></li>
        <li><span class="ctl-ic" aria-hidden="true"><svg viewBox="0 0 44 34" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="5" width="14" height="24" rx="7" fill="#fff8e8"/><path d="M22 5a7 7 0 0 0-7 7h7z" fill="#f06a5b" stroke="none"/><path d="M15 12h14M22 5v7"/><path d="M10 17H3m0 0l3-3m-3 3l3 3M34 17h7m0 0l-3-3m3 3l-3 3"/></svg></span><span class="ctl-tx">拖动转视角</span></li>
        <li><span class="ctl-ic" aria-hidden="true"><svg viewBox="0 0 44 34" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="5" width="14" height="24" rx="7" fill="#fff8e8"/><path d="M11 12h14"/><rect x="16.4" y="7.6" width="3.2" height="7" rx="1.6" fill="#f06a5b" stroke="none"/><path d="M34 7v20m-3.5-16.5L34 7l3.5 3.5M30.5 23.5L34 27l3.5-3.5"/></svg></span><span class="ctl-tx">滚轮拉远近</span></li>
      </ul>
      <ul class="ctl touch-only" aria-label="操作说明">
        <li><span class="ctl-ic"><kbd>▲</kbd><kbd>▼</kbd></span><span class="ctl-tx">加速 · 减速</span></li>
        <li><span class="ctl-ic"><kbd>◀</kbd><kbd>▶</kbd></span><span class="ctl-tx">左右转向</span></li>
        <li><span class="ctl-ic" aria-hidden="true"><svg viewBox="0 0 44 34" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="17" r="9" stroke-opacity=".35"/><circle cx="22" cy="17" r="4.5" fill="#f06a5b" stroke="none"/><path d="M9 17H3m0 0l3-3m-3 3l3 3M35 17h6m0 0l-3-3m3 3l-3 3"/></svg></span><span class="ctl-tx">单指转视角</span></li>
      </ul>
      <div class="go-row">
        <span id="loading">正在搭建场景…</span>
        <button id="btnStart" class="btn go" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 15.5h19l-2.7 4a2 2 0 0 1-1.7.9H6.9a2 2 0 0 1-1.7-.9z" fill="currentColor" stroke="none"/><path d="M12 3.5v10"/><path d="M12 4.5l6.5 9H12z" fill="currentColor" fill-opacity=".35"/></svg><span>启程</span></button>
      </div>
    </div>
  </section>

  <div id="toolbar">
  <div class="tools">
    <button id="btnSound" class="round" aria-pressed="true" title="关闭声音 (M)" aria-label="声音开关">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
    <button id="btnHome" class="round" aria-label="回到起点" title="回到起点" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4.5v4.3h4.3"/></svg>
    </button>
    <button id="btnHelp" class="round" aria-label="操作说明" title="操作说明">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.4-1.5 1.1-1.5 2.1V15"/><circle cx="12" cy="18.6" r="1.1" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>
  <div id="help" class="card" hidden>
    <div class="row"><h2>怎么划船</h2><button id="btnHelpClose" class="round" aria-label="关闭说明" style="width:34px;height:34px;box-shadow:none;background:var(--paper-2)">✕</button></div>
    <ul class="keys">
      <li><kbd>↑</kbd> 加速</li><li><kbd>↓</kbd> 减速 / 倒退</li>
      <li><kbd>←</kbd><kbd>→</kbd> 转向</li><li><kbd>M</kbd> 声音开关</li>
      <li><kbd>拖动</kbd> 转动视角</li><li><kbd>滚轮</kbd> 镜头远近</li>
      <li><kbd>C</kbd> 跟随 / 运镜</li><li><kbd>E</kbd> 捞起花灯</li>
      <li><kbd>Esc</kbd> 合上信</li>
    </ul>
  </div>
  </div>

  <div id="poem" hidden aria-label="海上生明月，天涯共此时">
